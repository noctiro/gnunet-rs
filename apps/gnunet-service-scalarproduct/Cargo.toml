[package]
name = "gnunet-service-scalarproduct"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "gnunet-service-scalarproduct-ecc-alice"
path = "src/bin/alice.rs"

[[bin]]
name = "gnunet-service-scalarproduct-ecc-bob"
path = "src/bin/bob.rs"

[[bin]]
name = "gnunet-service-scalarproduct-alice"
path = "src/bin/paillier_alice.rs"

[[bin]]
name = "gnunet-service-scalarproduct-bob"
path = "src/bin/paillier_bob.rs"

[target.'cfg(unix)'.dependencies]
gnunet-scalarproduct-paillier = { workspace = true, features = ["alloc"] }
gnunet-scalarproduct = { workspace = true, features = ["alloc"] }
gnunet-scalarproduct-host.workspace = true
gnunet-cadet-host.workspace = true
gnunet-seti-client-host.workspace = true
gnunet-client-host.workspace = true
gnunet-config.workspace = true
gnunet-program-host = { workspace = true, features = ["service-runtime"] }
gnunet-resolver-broker.workspace = true
gnunet-service-runtime.workspace = true
gnunet-service-startup.workspace = true
gnunet-types.workspace = true
gnunet-wire.workspace = true
tokio = { workspace = true, features = ["rt", "signal", "time"] }

[lints]
workspace = true
