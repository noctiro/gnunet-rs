# Foreground reference; adjust all dependency endpoints to real running services.
# This service does not create a NAMESTORE/GNS daemon or private key file.
[reclaim]
HOSTNAME = localhost
PORT = 0
UNIXPATH = /tmp/gnunet-reclaim.sock
UNIX_MATCH_UID = YES
UNIX_MATCH_GID = NO
TICKET_REFRESH_INTERVAL = 1 h

[namestore]
HOSTNAME = localhost
PORT = 0
UNIXPATH = /tmp/gnunet-namestore.sock

[gns]
HOSTNAME = localhost
PORT = 0
UNIXPATH = /tmp/gnunet-gns.sock

[resolver]
HOSTNAME = localhost
PORT = 0
UNIXPATH = /tmp/gnunet-resolver.sock

[reclaim-rust]
MAX_CLIENTS = 16
MAX_JOBS = 32
JOBS_PER_CLIENT = 8
PROVIDER_SOURCES = 16
SCAN_ROWS = 256
RECORDS_PER_SET = 256
MAX_ITEMS = 256
RETAINED_BYTES = 16 MiB
FRAME_BYTES = 65535
WORK_UNITS = 32000000
IO_SLICE_BYTES = 65535
FIRST_INPUT_TIMEOUT = 30 s
INPUT_LIFETIME = 30 s
OUTPUT_LIFETIME = 30 s
OPERATION_LIFETIME = 180 s
RETIREMENT_GRACE = 5 s
SHUTDOWN_GRACE = 10 s
GNS_OPTIONS = 0
GNS_RECURSION_DEPTH = 128
