[package]
name = "gnunet-service-statistics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []

[lints]
workspace = true

[dependencies]
gnunet-config.workspace = true
gnunet-ipc-unix.workspace = true
gnunet-statistics = { workspace = true, features = ["alloc"] }
gnunet-statistics-store.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "signal"] }
gnunet-service-runtime.workspace = true

gnunet-program-host = { workspace = true, features = ["service-runtime"] }
gnunet-service-startup.workspace = true

[dev-dependencies]
# Existing isolated activation example uses libc; production startup does not.
libc.workspace = true

[target.'cfg(windows)'.dev-dependencies]
gnunet-native.workspace = true
socket2.workspace = true
