# Rust production configuration. Requires an installed actual DHT publish factory.
[zonemaster]
START_ON_DEMAND = YES
RUN_PER_USER = YES
IMMEDIATE_START = YES
HOSTNAME = localhost
BINARY = gnunet-service-zonemaster
UNIXPATH = $GNUNET_USER_RUNTIME_DIR/gnunet-service-zonemaster.sock
UNIX_MATCH_UID = NO
UNIX_MATCH_GID = NO
WORKER_COUNT = 4
MAX_PARALLEL_BACKGROUND_QUERIES = 1000
ZONE_PUBLISH_TIME_WINDOW = 4 h

[zonemaster-rust]
MAX_JOBS = 5000
MAX_FENCE_LABELS = 10000
PAYLOAD_BYTES = 268435456
WORKER_QUEUE = 5000
SOURCE_LIFETIME = 1 d
CONTROL_TIMEOUT = 10 s
JOB_TIMEOUT = 60 s
CAPACITY_RETRY = 100 ms
MAX_RECORDS = 2048
MAX_CLIENTS = 128
CLIENT_IDLE_TIMEOUT = 60 s
CLIENT_PARTIAL_TIMEOUT = 10 s
SHUTDOWN_GRACE = 10 s
