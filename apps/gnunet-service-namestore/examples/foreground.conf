# Foreground-only explicit local SERVICE example. Use a fresh owned directory.
[namestore]
HOSTNAME = localhost
PORT = 0
UNIXPATH = /tmp/gnunet-rust-namestore.sock
UNIX_MATCH_UID = YES
UNIX_MATCH_GID = NO
ACCEPT_FROM = 127.0.0.1;
ACCEPT_FROM6 = ::1;

[namestore-rust]
DIRECTORY = /tmp/gnunet-rust-namestore-owned-store
MAX_CLIENTS = 32
MAX_LABELS = 1024
MAX_ZONES = 256
ITERATORS_PER_CLIENT = 1
OUTPUT_FRAMES = 1
OUTPUT_BYTES = 65535
FRAME_BYTES = 65535
IO_SLICE_BYTES = 65535
IMAGE_BYTES = 4 MiB
RETAINED_BYTES = 16 MiB
STORE_BODY_BYTES = 8 MiB
MONITOR_CHANGES = 8
SCAN_ROWS = 16
FIRST_INPUT_TIMEOUT = 30 s
INPUT_LIFETIME = 30 s
OUTPUT_LIFETIME = 30 s
STORAGE_LIFETIME = 30 s
SHUTDOWN_GRACE = 10 s
