[package]
name = "gnunet-scalarproduct-command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(unix)'.dependencies]
gnunet-scalarproduct-client-host.workspace = true
gnunet-config.workspace = true
gnunet-crypto.workspace = true
gnunet-program-host = { workspace = true, features = ["runtime", "resolver-broker"] }
gnunet-client-host.workspace = true
gnunet-resolver-broker.workspace = true
gnunet-service-runtime.workspace = true
num-bigint = { workspace = true, features = ["std"] }
