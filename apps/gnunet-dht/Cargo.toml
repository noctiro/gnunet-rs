[package]
name = "gnunet-dht-command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gnunet-program-host = { workspace = true, features = ["resolver-broker", "binary-io"] }
gnunet-client-host.workspace = true
gnunet-config.workspace = true
gnunet-dht-client-host.workspace = true
gnunet-crypto.workspace = true
gnunet-gnsrecord.workspace = true
gnunet-resolver-broker.workspace = true
gnunet-service-runtime.workspace = true
gnunet-service-startup.workspace = true
gnunet-types.workspace = true
gnunet-wire.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "signal"] }

[[bin]]
name = "gnunet-dht-get"
path = "src/get.rs"

[[bin]]
name = "gnunet-dht-put"
path = "src/put.rs"

[[bin]]
name = "gnunet-dht-monitor"
path = "src/monitor.rs"

[[bin]]
name = "gnunet-dht-hello"
path = "src/hello.rs"

[lints]
workspace = true
