[package]
name = "gnunet-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "gnunet-cli"

[[bin]]
name = "gnunet-did"
path = "src/bin/gnunet-did.rs"
required-features = ["did"]

[[bin]]
name = "gnunet-download"
path = "src/bin/gnunet-download.rs"
required-features = ["fs"]

[[bin]]
name = "gnunet-fs"
path = "src/bin/gnunet-fs.rs"
required-features = ["fs"]

[[bin]]
name = "gnunet-unindex"
path = "src/bin/gnunet-unindex.rs"
required-features = ["fs"]

[[bin]]
name = "gnunet-namestore"
path = "src/bin/gnunet-namestore.rs"
required-features = ["namestore"]

[[bin]]
name = "gnunet-statistics"
path = "src/bin/gnunet-statistics.rs"
required-features = ["statistics"]

[[bin]]
name = "gnunet-identity"
path = "src/bin/gnunet-identity.rs"
required-features = ["identity"]

[[bin]]
name = "gnunet-namestore-zonefile"
path = "src/bin/gnunet-namestore-zonefile.rs"
required-features = ["namestore"]

[[bin]]
name = "gnunet-publish"
path = "src/bin/gnunet-publish.rs"
required-features = ["fs"]

[[bin]]
name = "gnunet-reclaim"
path = "src/bin/gnunet-reclaim.rs"
required-features = ["reclaim"]

[[bin]]
name = "gnunet-regex"
path = "src/bin/gnunet-regex.rs"
required-features = ["regex"]

[[bin]]
name = "gnunet-revocation"
path = "src/bin/gnunet-revocation.rs"
required-features = ["revocation"]

[[bin]]
name = "gnunet-search"
path = "src/bin/gnunet-search.rs"
required-features = ["fs"]

[[bin]]
name = "gnunet-transport"
path = "src/bin/gnunet-transport.rs"
required-features = ["transport"]

[[bin]]
name = "gnunet-vpn"
path = "src/bin/gnunet-vpn.rs"
required-features = ["vpn"]

[lints]
workspace = true

[features]
default = ["cadet", "did", "fs", "identity", "namestore", "peerstore", "reclaim", "regex", "revocation", "statistics", "transport", "vpn"]
cadet = ["gnunet/official-cadet-client"]
did = ["runtime", "gnunet/official-did-client"]
fs = ["runtime", "gnunet/official-fs-network", "gnunet/official-identity-client", "gnunet/fs-compression"]
identity = ["dep:gnunet-client-host", "dep:gnunet-config", "dep:gnunet-native", "dep:gnunet-program-host", "dep:gnunet-resolver-broker", "dep:gnunet-service-runtime", "gnunet/official-identity-client"]
namestore = ["identity", "gnunet/official-namestore-client", "gnunet/gnsrecord-text"]
peerstore = ["gnunet/official-peerstore-client"]
reclaim = ["runtime", "gnunet/official-identity-client", "gnunet/official-reclaim-client", "gnunet/reclaim-credentials"]
regex = ["runtime", "gnunet/official-regex-client"]
revocation = ["runtime", "gnunet/revocation", "gnunet/official-identity-client", "gnunet/official-revocation-client"]
statistics = ["runtime", "gnunet/official-ipc"]
transport = ["runtime", "gnunet/official-transport-observation"]
vpn = ["runtime", "gnunet/official-vpn-client"]
runtime = ["dep:gnunet-native", "dep:gnunet-ipc-unix", "dep:gnunet-client", "dep:gnunet-client-host", "dep:gnunet-config", "dep:gnunet-program-host", "dep:gnunet-resolver-broker", "dep:gnunet-service-runtime", "dep:gnunet-service-startup", "dep:gnunet-types"]

[dependencies]
gnunet = { path = "../../crates/gnunet", default-features = false }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "net", "time", "fs", "signal", "sync"] }
zeroize.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }

# The continuous consumer uses the same original configured native statistics
# owner/Clock/Resolver as services; one Runtime is created only for this command.
[target.'cfg(any(unix, windows))'.dependencies]
gnunet-native = { workspace = true, optional = true }
gnunet-ipc-unix = { workspace = true, optional = true }
gnunet-client = { workspace = true, optional = true }
gnunet-client-host = { workspace = true, optional = true }
gnunet-config = { workspace = true, optional = true }
gnunet-program-host = { workspace = true, features = ["resolver-broker"], optional = true }
gnunet-resolver-broker = { workspace = true, optional = true }
gnunet-service-runtime = { workspace = true, optional = true }
gnunet-service-startup = { workspace = true, optional = true }
gnunet-types = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["poll", "fs"] }

[target.'cfg(windows)'.dev-dependencies]
socket2.workspace = true
