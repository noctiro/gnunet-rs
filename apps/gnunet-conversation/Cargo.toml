[package]
name = "gnunet-conversation-command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(unix)'.dependencies]
gnunet-conversation-client-host.workspace = true
gnunet-identity-client-host.workspace = true
gnunet-identity.workspace = true
gnunet-pils-host = { workspace = true, features = ["client"] }
gnunet-pils = { workspace = true, features = ["alloc"] }
gnunet-gns-host.workspace = true
gnunet-gns-client-host.workspace = true
gnunet-gnsrecord.workspace = true
gnunet-gnsrecord-text.workspace = true
gnunet-idna.workspace = true
gnunet-crypto.workspace = true
gnunet-wire.workspace = true
gnunet-types.workspace = true
gnunet-config.workspace = true
gnunet-program-host = { workspace = true, features = ["runtime", "resolver-broker"] }
gnunet-client-host.workspace = true
gnunet-resolver-broker.workspace = true
gnunet-service-runtime.workspace = true
tokio = { workspace = true, features = ["rt", "time", "net", "signal"] }
nix.workspace = true
zeroize = { workspace = true, features = ["alloc"] }

[[bin]]
name = "gnunet-conversation"
path = "src/main.rs"

[lints]
workspace = true
