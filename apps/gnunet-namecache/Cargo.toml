[package]
name = "gnunet-namecache-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[target.'cfg(unix)'.dependencies]
gnunet-client-host.workspace = true
gnunet-config.workspace = true
gnunet-gnscrypto.workspace = true
gnunet-gnsrecord.workspace = true
gnunet-gnsrecord-text.workspace = true
gnunet-idna.workspace = true
gnunet-namecache-client-host.workspace = true
gnunet-program-host = { workspace = true, features = ["resolver-broker"] }
