# Example input only. Running this config mutates an actual interface.
# Supply the actual TUN_IFNAME on Linux; use the actual utun name on macOS,
# or omit TUN_IFNAME for kernel selection and inspect the verified READY name.
[exit]
ENABLE_IPV4 = YES
ENABLE_IPV6 = YES
EXIT_IPV4 = YES
EXIT_IPV6 = YES
EXIT_RANGE_IPV4_POLICY = 0.0.0.0/0:!25;
EXIT_RANGE_IPV6_POLICY = ::/0:!25;
EXIT_DNS = NO
IPV4ADDR = 10.89.0.1
IPV4MASK = 255.255.255.0
IPV6ADDR = fd89::1
IPV6PREFIX = 64

[cadet]
UNIXPATH = /tmp/gnunet-example/cadet.sock

[regex]
UNIXPATH = /tmp/gnunet-example/regex.sock

[exit-rust]
TUN_MODE = fresh
MTU = 1400
DAD_TIMEOUT = 10 s
ADDRESS_WATCH_LIFETIME = 60 s
CONFIGURE_TIMEOUT = 10 s
SHUTDOWN_GRACE = 5 s
# Explicit additional interface routes, only if absent. A preexisting route
# returning EEXIST is an actual failure, not adopted/deleted by this daemon.
# ROUTES = 10.90.0.0/24; fd90::/64
# Optional exact same-family next hop uses prefix@gateway.
# Internet permission and announcements both use the official EXIT_RANGE policies.
# Per-protocol private POLICY/DEFAULT_ALLOW configuration is rejected.

# One actual port binds both protocols; targets remain independent.
[example.gnunet.]
TCP_REDIRECTS = 8080:localhost4:8081
UDP_REDIRECTS = 8080:localhost4:8082
