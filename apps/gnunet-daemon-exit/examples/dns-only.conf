# Example input only. This candidate has not executed any sockets or services.
[exit]
ENABLE_IPV4 = NO
ENABLE_IPV6 = NO
EXIT_IPV4 = NO
EXIT_IPV6 = NO
EXIT_DNS = YES
DNS_RESOLVER = 127.0.0.1

[cadet]
UNIXPATH = /tmp/gnunet-example/cadet.sock

[exit-rust]
TUN_MODE = none
DNS_RESOLVER_PORT = 5353
MAX_DNS_JOBS = 32
STARTUP_TIMEOUT = 30 s
SHUTDOWN_GRACE = 5 s
