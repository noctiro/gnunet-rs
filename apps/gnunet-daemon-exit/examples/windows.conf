# Replace WINTUN_DLL with a trusted official provider path.
# Configure actual host forwarding/firewall/NAT policy before using Internet exit.
[exit]
TUN_IFNAME = exit-gnunet
EXIT_IFNAME = -
ENABLE_IPV4 = YES
ENABLE_IPV6 = YES
EXIT_IPV4 = YES
EXIT_IPV6 = YES
EXIT_RANGE_IPV4_POLICY = 0.0.0.0/0:!25;
EXIT_RANGE_IPV6_POLICY = ::/0:!25;
IPV4ADDR = 10.89.0.1
IPV4MASK = 255.255.255.0
IPV6ADDR = fd89::1
IPV6PREFIX = 64
EXIT_DNS = NO

[exit-rust]
TUN_MODE = fresh
WINTUN_DLL = C:/Program Files/Wintun/wintun.dll
WINTUN_RING_BYTES = 4194304
MTU = 1400
# Select the actual opposite peer's representation; this example targets Linux.
PEER_AF_PROFILE = linux
STARTUP_TIMEOUT = 30 s
CONFIGURE_TIMEOUT = 10 s
DAD_TIMEOUT = 10 s
SHUTDOWN_GRACE = 5 s
