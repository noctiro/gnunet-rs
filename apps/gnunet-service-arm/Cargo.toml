[package]
name = "gnunet-service-arm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[target.'cfg(any(unix, windows))'.dependencies]
gnunet-config.workspace = true
gnunet-arm-service-host = { workspace = true, features = ["service"] }
gnunet-program-host = { workspace = true, features = ["service-runtime"] }
gnunet-service-startup.workspace = true
[lints]
workspace = true

[target.'cfg(windows)'.dev-dependencies]
gnunet-service-runtime.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "io-util"] }
gnunet-arm-core.workspace = true
gnunet-native.workspace = true
socket2.workspace = true

[[test]]
name = "windows_process"
path = "tests/windows_process.rs"
harness = false
