# Normal [nse] endpoint comes from installed official service configuration.
# These keys are local Rust CLIENT resource ceilings, not new wire fields.
[nse-client-rust]
FIRST_ESTIMATE_TIMEOUT = 60 s
SOURCE_LIFETIME = 1 d
INITIAL_TIMEOUT = 30 s
INPUT_TIMEOUT = 10 s
OUTPUT_TIMEOUT = 10 s
# Optional finite total monitor duration. Omit for monitoring until signal.
# MONITOR_TIMEOUT = 1 h
