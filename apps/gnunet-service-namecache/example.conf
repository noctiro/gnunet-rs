[namecache]
HOSTNAME = localhost
PORT = 2113
UNIXPATH = ${GNUNET_RUNTIME_DIR}/gnunet-service-namecache.sock
UNIX_MATCH_UID = YES
UNIX_MATCH_GID = NO
ACCEPT_FROM = 127.0.0.1;
ACCEPT_FROM6 = ::1;

[namecache-rust]
BACKEND = memory
MAX_ENTRIES = 1024
CACHE_BYTES = 8 MiB
MAX_BLOCK_BYTES = 63 KiB
MAX_CLIENTS = 32
FRAME_BYTES = 65535
OUTPUT_FRAMES = 4
OUTPUT_BYTES = 262140
IO_SLICE_BYTES = 65535
FIRST_INPUT_TIMEOUT = 30 s
INPUT_LIFETIME = 30 s
OUTPUT_LIFETIME = 30 s
MAINTENANCE_INTERVAL = 1 h
SHUTDOWN_GRACE = 10 s
