# Input only. Running this program requires real native TUN/admin permissions
# and changes the newly owned interface/routes. No commands are run by this file.
[vpn]
HOSTNAME = localhost
PORT = 0
UNIXPATH = /tmp/gnunet-example/vpn.sock
UNIX_MATCH_UID = YES
UNIX_MATCH_GID = NO
IFNAME = vpn-gnunet
IPV4ADDR = 10.91.0.1
IPV4MASK = 255.255.255.0
IPV6ADDR = fd91::1
IPV6PREFIX = 64
MAX_MAPPING = 200
MAX_TUNNELS = 200

[cadet]
HOSTNAME = localhost
PORT = 0
UNIXPATH = /tmp/gnunet-example/cadet.sock

[regex]
HOSTNAME = localhost
PORT = 0
UNIXPATH = /tmp/gnunet-example/regex.sock

[vpn-rust]
TUN_MODE = fresh
EXIT_DISCOVERY = regex
REGEX_SEARCHES = 16
REGEX_SEND_TIMEOUT = 10 s
REGEX_FIRST_RESULT_TIMEOUT = 30 s
REGEX_SEARCH_TIMEOUT = 60 s
REGEX_IO_SLICE_BYTES = 65535
MTU = 1280
MAX_CLIENTS = 8
REQUESTS_PER_CLIENT = 32
REQUEST_SLOTS = 256
PACKET_SLOTS = 16
PACKET_SLOT_BYTES = 2048
LARGE_PACKET_SLOTS = 4
LARGE_PACKET_BYTES = 65575
STARTUP_TIMEOUT = 30 s
CONFIGURE_TIMEOUT = 10 s
SHUTDOWN_GRACE = 10 s
# macOS must set [vpn] IFNAME=utunN, a free actual kernel unit.
# For an already configured parent-transferred descriptor use:
# TUN_MODE = preopened
# and GNUNET_VPN_TUN_FD=<the exclusively transferred actual FD>.
# Automatic Internet discovery uses the actual [regex] endpoint above.
# To select fixed policy instead, set EXIT_DISCOVERY = configured.
# An empty fixed-policy list supports named SERVICE flows but fails Internet selection.
# Supply real authorized exit identity values; placeholders are not peer results.
# CONFIGURED_EXITS = <actual-peer> 0.0.0.0/0 tcp 1-65535 linux; <actual-peer> ::/0 udp 1-65535 darwin
