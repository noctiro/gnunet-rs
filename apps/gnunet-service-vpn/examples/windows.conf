# Explicit Windows Wintun configuration; replace WINTUN_DLL with a trusted path.
[vpn]
IFNAME = vpn-gnunet
UNIXPATH = $GNUNET_RUNTIME_DIR/gnunet-service-vpn.sock
UNIX_MATCH_UID = NO
UNIX_MATCH_GID = NO

[vpn-rust]
TUN_MODE = fresh
WINTUN_DLL = C:/Program Files/Wintun/wintun.dll
WINTUN_RING_BYTES = 4194304
LOCAL_ACCESS = owner
EXIT_DISCOVERY = regex
