# Official SERVICE endpoint and ACL keys. A separate process owns each actual
# PILS/PEERSTORE/NAT/STATISTICS service and supported communicator.
[transport]
BINARY = gnunet-service-transport
START_ON_DEMAND = YES
HOSTNAME = localhost
PORT = 0
UNIXPATH = $GNUNET_RUNTIME_DIR/gnunet-service-transport.sock
ACCEPT_FROM = 127.0.0.1;
ACCEPT_FROM6 = ::1;
UNIX_MATCH_UID = YES
UNIX_MATCH_GID = YES
# Optional actual HELLO/RTT→standard1253 orchestration. Requires a live
# registered can_burst communicator; completion is no reachability proof.
USE_BURST_NAT = NO
# USERNAME = gnunet

[pils]
# One explicit identity/HELLO build profile for the node: reference029 or deterministic.
PROFILE = reference029
HOSTNAME = localhost
PORT = 0
UNIXPATH = $GNUNET_RUNTIME_DIR/gnunet-service-pils.sock

[peerstore]
HOSTNAME = localhost
PORT = 0
UNIXPATH = $GNUNET_RUNTIME_DIR/gnunet-service-peerstore.sock

[nat]
HOSTNAME = localhost
PORT = 0
UNIXPATH = $GNUNET_RUNTIME_DIR/gnunet-service-nat.sock

[statistics]
HOSTNAME = localhost
PORT = 0
UNIXPATH = $GNUNET_RUNTIME_DIR/gnunet-service-statistics.sock

[transport-rust]
# New Rust-owned public generation counter directory; namespace marker/lock and
# canonical commit are created by Reservations. No C key/store is imported.
MONOTIME_STORE = $GNUNET_DATA_HOME/transport-rust-monotime
# Optional source-local assertion; when present it must match [pils] PROFILE.
# PILS_PROFILE = reference029
MAX_CLIENTS = 32
MAX_QUEUES = 128
MAX_PEERS = 64
MAX_MESSAGES = 256
PAYLOAD_BYTES = 4 MiB
CONTROL_MESSAGES = 8
CONTROL_BYTES = 4 KiB
MAX_ASSEMBLIES = 64
ASSEMBLIES_PER_PEER = 32
# Per actual accepted source; buffers allocate at actual retained length.
PENDING_BYTES = 256 KiB
IO_SLICE_BYTES = 65535
OPERATION_LIFETIME = 60 s
# Source recovery/stable restart generation; not an accepted-client first-frame deadline.
RECOVERY_WINDOW = 10 s
SHUTDOWN_GRACE = 5 s
MAINTENANCE_INTERVAL = 50 ms
CLIENT_SOURCE_LIFETIME = 1 d
CLIENT_INPUT_LIFETIME = 10 s
CLIENT_OUTPUT_LIFETIME = 10 s
PEERSTORE_OPERATIONS = 64
PEERSTORE_SOURCE_BYTES = 1 MiB
PEERSTORE_OUTPUT_FRAMES = 64
PEERSTORE_OUTPUT_BYTES = 1 MiB
PEERSTORE_INITIAL_LIFETIME = 30 s
PEERSTORE_INPUT_LIFETIME = 10 s
PEERSTORE_SOURCE_LIFETIME = 1 d
PEERSTORE_RETRY = 100 ms
PILS_JOBS = 24
PILS_SOURCE_LIFETIME = 1 d
PILS_INITIAL_LIFETIME = 30 s
PILS_INPUT_LIFETIME = 10 s
PILS_RETIREMENT = 2 s
DISCOVERY_PEERS = 16
DISCOVERY_RECORDS = 256
DISCOVERY_BYTES = 256 KiB
ADDRESS_BYTES = 4096
HELLO_BYTES = 65535
HELLO_ADDRESSES = 256
DISCOVERY_RECORD_QUANTUM = 16
DISCOVERY_IO_QUANTUM = 8
DISCOVERY_QUERY_LIFETIME = 30 s
DISCOVERY_QUERY_REFRESH = 60 s
DISCOVERY_MONITOR_LIFETIME = 300 s
DISCOVERY_IDLE_LIFETIME = 600 s
DISCOVERY_INITIAL_LIFETIME = 10 s
DISCOVERY_PARTIAL_LIFETIME = 5 s
DISCOVERY_RETRY = 1 s
RESOLVER_QUEUE_FRAMES = 8

# Numeric anti-replay range width. Upper bound is durably reserved before use.
SENDER_MONOTIME_HORIZON = 5 min

# Independent Rust-owned permanent DV LEARN/BOX ledger; no C/T1 adoption.
DV_STORE = $GNUNET_DATA_HOME/transport-rust-dv
DV_STORE_RECORDS = 8192
DV_NEIGHBOURS = 64
DV_INPUTS = 16
DV_OUTPUTS = 16
DV_FRAME_BYTES = 65535
DV_BYTES = 1048576
DV_ROUTES = 192
DV_PROBES = 8
DV_SOURCE_SLOTS = 64
DV_MATERIALS = 16
DV_REPLAY_PEERS = 128
DV_REPLAY_NONCES = 4096
# Shared across peers, independently of their number.
DV_PLAINTEXT_LOANS = 4
DV_QUANTUM = 8
