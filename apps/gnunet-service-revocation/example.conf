[revocation]
HOSTNAME = localhost
PORT = 0
UNIXPATH = /tmp/gnunet-revocation.sock
UNIX_MATCH_UID = YES
UNIX_MATCH_GID = NO
WORKBITS = 22
EPOCH_DURATION = 365 d
DATABASE = /tmp/gnunet-revocation-public.dat

[revocation-rust]
# Uses only a new marked Rust-owned directory, never DATABASE itself.
STORE_DIRECTORY = /tmp/gnunet-revocation-public.rust-store
MAX_CLIENTS = 32
MAX_PEERS = 32
MAX_CERTIFICATES = 8192
SNAPSHOT_BYTES = 4194304
NETWORK_INPUTS = 64
IO_SLICE_BYTES = 65535
FIRST_INPUT_TIMEOUT = 30 s
OPERATION_LIFETIME = 30 s
OUTPUT_LIFETIME = 5 s
RETIREMENT_GRACE = 5 s
LISTENER_LIFETIME = 1 h
RETRY_INTERVAL = 1 s
RECONCILIATION_INTERVAL = 5 min
TICK_INTERVAL = 100 ms
SHUTDOWN_GRACE = 5 s
CORE_CLASS_ORDER = native
SETU_ABI = native
# [core] and [setu] actual endpoint settings belong in the caller configuration.

# Original nonpersistent STATISTICS mutation and final-drain hard limits.
STATISTICS_TIMEOUT = 5 s
STATISTICS_SHUTDOWN_GRACE = 5 s
