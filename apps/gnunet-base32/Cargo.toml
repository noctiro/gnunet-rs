[package]
name = "gnunet-base32-command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "gnunet-base32"
path = "src/main.rs"

[dependencies]
gnunet-gnsrecord.workspace = true
gnunet-program-host = { workspace = true, features = ["binary-io"] }
gnunet-native.workspace = true
gnunet-config.workspace = true
gnunet-service-runtime.workspace = true
tokio = { workspace = true, features = ["rt", "net", "signal", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[lints]
workspace = true
