[package]
name = "gnunet-core-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "gnunet-core"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
gnunet-config.workspace = true
gnunet-core-client-host.workspace = true
gnunet-client-host.workspace = true
gnunet-types.workspace = true
gnunet-program-host = { workspace = true, features = ["resolver-broker"] }
gnunet-resolver-broker.workspace = true
gnunet-service-runtime.workspace = true
gnunet-service-startup.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "signal"] }

[lints]
workspace = true
