[package]
name = "gnunet-pils-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
service = ["dep:gnunet-config", "dep:gnunet-service-runtime", "dep:gnunet-service-startup", "dep:tokio", "tokio/net"]
client = ["gnunet-pils/alloc", "dep:gnunet-hello", "dep:gnunet-client-host", "dep:gnunet-service-runtime", "dep:tokio"]

[dependencies]
gnunet-pils = { path = "../../crates/gnunet-pils", default-features = false }
gnunet-types.workspace = true
gnunet-wire.workspace = true
getrandom.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["user"] }
zeroize = { workspace = true, features = ["alloc"] }

gnunet-config = { workspace = true, optional = true }
gnunet-service-startup = { workspace = true, optional = true }
gnunet-hello = { workspace = true, optional = true }
gnunet-client-host = { workspace = true, optional = true }
gnunet-service-runtime = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "time"] }

[lints]
workspace = true

[dev-dependencies]
gnunet-config.workspace = true
gnunet-crypto.workspace = true
gnunet-session-crypto.workspace = true
serde_json = { workspace = true, features = ["std"] }

[[example]]
name = "pils-client"
required-features = ["client"]

[[test]]
name = "service"
required-features = ["service", "client"]
