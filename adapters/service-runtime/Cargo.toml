[package]
name = "gnunet-service-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []

[dependencies]
gnunet-wire.workspace = true
zeroize = { workspace = true, features = ["alloc"] }
gnunet-native.workspace = true
gnunet-config.workspace = true
gnunet-types.workspace = true
gnunet-crypto.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "signal", "io-util", "sync"] }
socket2.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix = { workspace = true, features = ["poll", "process", "user"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
nix = { workspace = true, features = ["socket", "uio"] }

[target.'cfg(any(windows, target_os = "macos", target_os = "freebsd"))'.dependencies]
gnunet-native = { workspace = true, features = ["socket-io"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "test-util"] }

[lints]
workspace = true

[[test]]
name = "windows_process"
path = "tests/windows_process.rs"
harness = false
