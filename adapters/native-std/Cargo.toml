[package]
name = "gnunet-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
dns-proxy = ["dep:objc2", "dep:block2", "dep:objc2-foundation", "dep:zeroize"]
dns-proxy-control = ["dns-proxy", "objc2-foundation/NSObject"]
process-job = ["windows-sys/Win32_System_JobObjects"]
socket-io = ["dep:socket2"]

[dependencies]
libc.workspace = true
getrandom.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["dir", "user", "poll"] }

[target.'cfg(any(unix, windows))'.dependencies]
socket2 = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["sched"] }

[target.'cfg(target_os = "freebsd")'.dependencies]
sha2 = { workspace = true, features = ["zeroize"] }
zeroize.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { workspace = true, optional = true }
block2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
zeroize = { workspace = true, features = ["alloc"] }
windows-sys = { workspace = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFirewall", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Com", "Win32_System_Environment", "Win32_System_GroupPolicy", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Variant", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }

[lints]
workspace = true

[[test]]
name = "windows_stdio"
path = "tests/windows_stdio.rs"
harness = false

[[test]]
name = "windows_date_parser"
path = "tests/windows_date_parser.rs"
harness = false
