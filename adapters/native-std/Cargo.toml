[package]
name = "gnunet-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []

[dependencies]
libc.workspace = true
getrandom.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["dir", "user", "poll"] }

[target.'cfg(windows)'.dependencies]
zeroize = { workspace = true, features = ["alloc"] }
windows-sys = { workspace = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Globalization", "Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFirewall", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Com", "Win32_System_Environment", "Win32_System_Registry", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Variant", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }

[lints]
workspace = true

[[test]]
name = "windows_stdio"
path = "tests/windows_stdio.rs"
harness = false

[[test]]
name = "windows_date_parser"
path = "tests/windows_date_parser.rs"
harness = false
