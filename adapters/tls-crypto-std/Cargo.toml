[package]
name = "gnunet-tls-crypto-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
aes.workspace = true
aes-gcm.workspace = true
chacha20.workspace = true
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
cipher.workspace = true
crypto-bigint.workspace = true
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
getrandom = { workspace = true, features = ["sys_rng"] }
hmac.workspace = true
ml-kem.workspace = true
p256 = { workspace = true, features = ["alloc", "ecdh", "pkcs8"] }
p384 = { workspace = true, features = ["alloc", "ecdh", "pkcs8"] }
p521 = { workspace = true, features = ["alloc", "ecdsa", "pkcs8"] }
rcgen.workspace = true
rscrypto = { version = "0.12.0", default-features = false, features = ["alloc", "ml-dsa"] }
rsa.workspace = true
rustls.workspace = true
sha2.workspace = true
time.workspace = true
x25519-dalek = { workspace = true, features = ["precomputed-tables"] }
x509-parser.workspace = true
yasna = { workspace = true, features = ["time"] }
zeroize.workspace = true

[lints]
workspace = true
