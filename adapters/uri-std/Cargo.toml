[package]
name = "gnunet-uri-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gnunet-config.workspace = true
gnunet-native.workspace = true
gnunet-program-host = { workspace = true, features = ["service-runtime"] }
gnunet-service-runtime.workspace = true
gnunet-service-startup.workspace = true
gnunet-types.workspace = true
tokio = { workspace = true, features = ["rt", "time", "signal"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[lints]
workspace = true

[[test]]
name = "dispatch"
path = "tests/dispatch.rs"
harness = false
