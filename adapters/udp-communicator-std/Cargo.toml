[package]
name = "gnunet-udp-communicator-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
transport = ["dep:gnunet-wire", "dep:gnunet-transport", "dep:gnunet-service-runtime", "dep:gnunet-nat-burst-host"]
pils-client = ["dep:gnunet-pils", "dep:gnunet-pils-host", "dep:gnunet-wire", "gnunet-pils-host/client"]

[dependencies]
gnunet-udp-communicator-core = { workspace = true, features = ["alloc"] }
gnunet-crypto.workspace = true
gnunet-types.workspace = true
getrandom.workspace = true
zeroize = { workspace = true, features = ["alloc"] }
socket2.workspace = true
libc.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "time"] }

gnunet-pils = { workspace = true, optional = true }
gnunet-pils-host = { workspace = true, optional = true }
gnunet-wire = { workspace = true, optional = true }
gnunet-transport = { workspace = true, optional = true }
gnunet-service-runtime = { workspace = true, optional = true }
gnunet-nat-burst-host = { workspace = true, optional = true }

[dev-dependencies]
gnunet-transport-host.workspace = true
gnunet-transport = { workspace = true, features = ["alloc"] }
tokio = { workspace = true, features = ["macros", "time"] }

[lints]
workspace = true

[[example]]
name = "normal_udp_peer"
required-features = ["pils-client", "transport"]
