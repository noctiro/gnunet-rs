[package]
name = "gnunet-nat-test-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
program = ["dep:gnunet-service-startup", "dep:gnunet-program-host", "dep:gnunet-resolver-broker"]

[dependencies]
gnunet-native.workspace = true
socket2 = { workspace = true, features = ["all"] }
gnunet-nat-client-host.workspace = true
gnunet-nat-host.workspace = true
gnunet-nat.workspace = true
gnunet-client-host.workspace = true
gnunet-service-runtime.workspace = true
gnunet-types.workspace = true
gnunet-wire.workspace = true
gnunet-config.workspace = true
gnunet-service-startup = { workspace = true, optional = true }
gnunet-program-host = { workspace = true, features = ["resolver-broker", "service-runtime"], optional = true }
gnunet-resolver-broker = { workspace = true, optional = true }
getrandom.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "io-util", "signal"] }

[lints]
workspace = true
