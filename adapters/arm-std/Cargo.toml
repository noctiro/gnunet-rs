[package]
name = "gnunet-arm-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []

[dependencies]
gnunet-arm-core.workspace = true
gnunet-types.workspace = true
gnunet-wire.workspace = true
gnunet-config.workspace = true
gnunet-client-host.workspace = true
gnunet-service-runtime.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time", "io-util", "signal", "sync"] }
gnunet-native.workspace = true

[target.'cfg(windows)'.dependencies]
gnunet-service-startup.workspace = true

[target.'cfg(unix)'.dev-dependencies]
gnunet-service-startup.workspace = true
nix = { workspace = true, features = ["process", "signal"] }
libc.workspace = true

[dev-dependencies]
gnunet-resolver-broker.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "windows_client"
harness = false

[lints]
workspace = true
