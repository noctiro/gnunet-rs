[package]
name = "gnunet-service-startup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []

[dependencies]
gnunet-service-runtime.workspace = true
gnunet-config.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }
gnunet-native.workspace = true
libc.workspace = true

[target.'cfg(windows)'.dependencies]
gnunet-crypto.workspace = true
gnunet-native.workspace = true
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
socket2.workspace = true
tokio = { workspace = true, features = ["rt", "net", "time"] }

[lints]
workspace = true

[[test]]
name = "windows_bootstrap"
path = "tests/windows_bootstrap.rs"
harness = false

[[test]]
name = "windows_daemon"
path = "tests/windows_daemon.rs"
harness = false

[[test]]
name = "windows_activation"
path = "tests/windows_activation.rs"
harness = false
