[package]
name = "gnunet-program-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
resolver-broker = ["dep:gnunet-resolver-broker", "runtime", "service-runtime"]
runtime = ["dep:tokio"]
binary-io = ["runtime", "dep:zeroize"]
service-runtime = ["runtime", "dep:gnunet-service-runtime", "dep:gnunet-service-startup"]

[dependencies]
libc = { workspace = true, features = ["std"] }
getrandom.workspace = true
gnunet-config.workspace = true
gnunet-crypto.workspace = true
gnunet-types.workspace = true
gnunet-native.workspace = true
gnunet-resolver-broker = { workspace = true, optional = true }
gnunet-service-runtime = { workspace = true, optional = true }
gnunet-service-startup = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "time", "sync"] }
zeroize = { workspace = true, optional = true, features = ["alloc"] }

[lints]
workspace = true

[[test]]
name = "absolute_calendar"
path = "tests/absolute_calendar.rs"
harness = false

[[test]]
name = "windows_logging"
path = "tests/windows_logging.rs"
harness = false
