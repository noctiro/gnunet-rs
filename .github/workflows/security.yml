name: Supply chain security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONOPTIMIZE: ''

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare the fixed secret scanner
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete Git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --config .gitleaks.toml --log-opts=--all .

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Cache the pinned audit executable
        id: audit-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cargo-audit/bin
          key: cargo-audit-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "=$CARGO_AUDIT_VERSION" --locked --no-default-features --root "$RUNNER_TEMP/cargo-audit"
      - name: Add the audit executable to PATH
        run: echo "$RUNNER_TEMP/cargo-audit/bin" >> "$GITHUB_PATH"
      - name: Audit all source lockfiles
        run: |
          mkdir -p target/audit
          database="$RUNNER_TEMP/advisory-db"
          git clone --depth 1 https://github.com/RustSec/advisory-db "$database"
          git -C "$database" rev-parse HEAD > target/audit/database-revision.txt
          lockfiles="$RUNNER_TEMP/source-lockfiles"
          git ls-files -z -- Cargo.lock '**/Cargo.lock' > "$lockfiles"
          test -s "$lockfiles"
          failed=0
          while IFS= read -r -d '' lockfile; do
            report="target/audit/$lockfile.json"
            mkdir -p "$(dirname "$report")"
            if cargo audit --db "$database" --no-fetch --file "$lockfile" --json --deny warnings > "$report"; then
              echo "$lockfile audit passed"
            else
              failed=1
              echo "$lockfile audit failed"
            fi
            cat "$report"
          done < "$lockfiles"
          exit "$failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit-results
          path: target/audit
          if-no-files-found: ignore
          retention-days: 7
