name: official-gnunet-quality

on: workflow_dispatch

permissions:
  contents: read

jobs:
  windows-startup-and-udp:
    name: Windows startup and native socket diagnostics
    runs-on: windows-2025
    timeout-minutes: 18
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          host: x86_64-pc-windows-msvc
      - name: Check the original UDP destination failure
        run: cargo test --offline --locked -p gnunet-udp-communicator-host --all-features --lib native_destination_failure_keeps_the_shared_socket_and_other_endpoint -- --nocapture
      - name: Check the native image boundary
        if: '!cancelled()'
        run: cargo test --offline --locked -p gnunet-uri-host --test dispatch
      - name: Check the STATISTICS CLI on the standard Windows stack
        if: '!cancelled()'
        run: cargo test --offline --locked -p gnunet-cli --no-default-features --features statistics --test statistics_process
