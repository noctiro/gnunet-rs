name: official-gnunet-quality

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTDOCFLAGS: -D warnings
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONOPTIMIZE: ''

jobs:
  security:
    name: Supply chain security
    uses: ./.github/workflows/security.yml

  checks:
    name: Source policies and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflow syntax and expressions
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - uses: ./.github/actions/setup-rust
      - run: cargo xtask verify source --log-dir target/ci/source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: source-check-logs
          path: target/ci/source
          if-no-files-found: ignore
          retention-days: 7

  tools:
    name: Tool controls (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.11' }
          - { os: macos-15, python: '3.14' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -B tools/check_tools.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tool-controls-${{ matrix.os }}
          path: target/tool-controls
          retention-days: 7

  native:
    needs: checks
    name: Native workspace (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, host: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, host: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, host: x86_64-apple-darwin }
          - { os: macos-15, host: aarch64-apple-darwin }
          - { os: windows-2025, host: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, host: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          host: ${{ matrix.host }}
      - run: cargo xtask verify native --log-dir target/ci/native
        env:
          # Keep Darwin paths short without using /tmp's final symlink.
          TMPDIR: ${{ runner.os == 'Windows' && runner.temp || runner.os == 'macOS' && '/private/tmp' || '/tmp' }}
          # Bound peak compiler and linker memory on hosted Windows runners.
          CARGO_BUILD_JOBS: ${{ runner.os == 'Windows' && '1' || '2' }}
          # GNU ld overflows CALL26 relocations in the large FS test executable.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C link-arg=-fuse-ld=lld
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: native-logs-${{ matrix.host }}
          path: target/ci/native
          if-no-files-found: ignore
          retention-days: 7

  freebsd:
    needs: checks
    name: Native workspace (FreeBSD ${{ matrix.release }} x86_64)
    strategy:
      fail-fast: false
      matrix:
        release: ['14.5', '15.1']
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run unprivileged checks and transfer diagnostics
        id: vm
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b
        with:
          release: ${{ matrix.release }}
          arch: x86_64
          # A single FS test compiler can exhaust a 6 GiB guest.
          mem: 10240
          cpu: 2
          sync: rsync
          copyback: true
          prepare: |
            set -eu
            pkg install -y ca_root_nss git python311 rustup-init
            kldload -n netlink
            ln -sf /usr/local/bin/python3.11 /usr/local/bin/python3
            pw useradd -n ci -m -s /bin/sh
          run: |
            set -eu
            source_directory=$PWD
            build_directory=$(mktemp -d /tmp/gnunet-ci.XXXXXX)
            cp -R "$source_directory/." "$build_directory"
            chown -R ci:ci "$build_directory"
            status=0
            su -l ci -c "cd '$build_directory' && sh tools/ci/freebsd.sh" || status=$?
            diagnostics="$source_directory/target/ci/freebsd"
            mkdir -p "$diagnostics"
            printf '%s\n' "$status" > "$diagnostics/exit-code"
            if [ -d "$build_directory/target/ci" ]; then
              cp -R "$build_directory/target/ci/." "$diagnostics"
            fi
            if [ -d "$build_directory/target/tool-controls" ]; then
              cp -R "$build_directory/target/tool-controls" "$diagnostics/tool-controls"
            fi
            if [ "$status" -ne 0 ]; then
              { swapinfo -h; dmesg | tail -n 100; } > "$diagnostics/resources.log" 2>&1 || true
            fi
            # The action copies back only after a successful transport step.
            # This synced tree contains diagnostics; builds stay in /tmp.
      - name: Require successful FreeBSD checks
        run: |
          status=$(cat target/ci/freebsd/exit-code)
          if ! [[ "$status" =~ ^(0|[1-9][0-9]{0,2})$ ]] || (( status > 255 )); then
            echo 'Invalid FreeBSD check result' >&2
            exit 1
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: freebsd-logs-${{ matrix.release }}-x86_64
          path: target/ci/freebsd
          if-no-files-found: ignore
          retention-days: 7

  embedded:
    needs: checks
    name: GNUnet no_std Cortex-M0, Cortex-M4 and RV32IMAC
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: thumbv6m-none-eabi, thumbv7em-none-eabi, riscv32imac-unknown-none-elf
      - run: cargo xtask verify embedded --log-dir target/ci/embedded
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: embedded-check-logs
          path: target/ci/embedded
          if-no-files-found: ignore
          retention-days: 7

  node-sdk:
    needs: checks
    name: Node SDK (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Android
            os: ubuntu-24.04
          - platform: iOS
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the Android Rust targets
        if: matrix.platform == 'Android'
        id: android-profile
        shell: bash
        run: |
          targets=$(bash platform/android/tools/build-sdk.sh --rust-targets)
          printf 'targets=%s\n' "$(paste -sd, - <<< "$targets")" >> "$GITHUB_OUTPUT"
      - name: Read the iOS Rust targets
        if: matrix.platform == 'iOS'
        id: ios-profile
        shell: bash
        run: |
          targets=$(sh platform/ios/build-sdk.sh --intel-simulator --rust-targets)
          printf 'targets=%s\n' "$(paste -sd, - <<< "$targets")" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ steps.android-profile.outputs.targets || steps.ios-profile.outputs.targets }}
      - name: Install the Android native SDK profile
        if: matrix.platform == 'Android'
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME" >> "$GITHUB_PATH"
          logs="$PWD/target/ci/node-sdk-android"
          mkdir -p "$logs"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          sdk_packages=$(bash platform/android/tools/build-sdk.sh --sdk-packages)
          mapfile -t packages <<< "$sdk_packages"
          "$sdkmanager" --install "${packages[@]}" </dev/null 2>&1 | tee "$logs/sdk-install.log"
      - name: Link and package the Android AAR for all supported ABIs
        if: matrix.platform == 'Android'
        shell: bash
        env:
          GNUNET_ANDROID_OUTPUT: ${{ github.workspace }}/target/ci/node-sdk-android
          GNUNET_ANDROID_BUILD_JOBS: ${{ env.CARGO_BUILD_JOBS }}
        run: bash platform/android/tools/build-sdk.sh
      - name: Package the iOS SDK and link the app and network extensions
        if: matrix.platform == 'iOS'
        id: ios-sdk
        shell: bash
        run: |
          logs="$PWD/target/ci/node-sdk-ios"
          mkdir -p "$logs"
          if ! package=$(GNUNET_IOS_BUILD_JOBS="$CARGO_BUILD_JOBS" sh platform/ios/build-sdk.sh \
            --intel-simulator 2>"$logs/package.log"); then
            cat "$logs/package.log" >&2
            exit 1
          fi
          test -n "$package"
          test -f "$package/Package.swift"
          test -f "$package/GNUnetNodeNative.xcframework/Info.plist"
          test -f "$package/LICENSE"
          test -f "$package/NOTICE.md"
          test -s "$package/THIRD_PARTY_LICENSES.txt"
          printf 'path=%s\n' "$package" >> "$GITHUB_OUTPUT"
          consumer=$(mktemp -d "$PWD/target/ios/consumer.XXXXXXXX")
          cp -R tools/ci/ios-sdk-consumer/. "$consumer/"
          ln -s "$package" "$consumer/GNUnetNode"
          verify_extension() {
            local bundle="$1/PlugIns/$2.appex"
            test -x "$bundle/$2"
            test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' \
              "$bundle/Info.plist")" = "com.apple.networkextension.$3"
            test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' \
              "$bundle/Info.plist")" = "$2.$4"
          }
          configurations=$(sh platform/ios/build-sdk.sh --intel-simulator --link-profiles)
          while read -r sdk arch; do
            case "$sdk" in
              iphonesimulator) destination='generic/platform=iOS Simulator' ;;
              iphoneos) destination='generic/platform=iOS' ;;
              *) exit 2 ;;
            esac
            derived="$consumer/build-$sdk-$arch"
            xcodebuild -project "$consumer/Consumer.xcodeproj" -scheme Consumer -configuration Debug \
              -destination "$destination" -derivedDataPath "$derived" -jobs "$CARGO_BUILD_JOBS" \
              ARCHS="$arch" CODE_SIGNING_ALLOWED=NO build </dev/null 2>&1 | tee "$logs/link-$sdk-$arch.log"
            app="$derived/Build/Products/Debug-$sdk/Consumer.app"
            test -x "$app/Consumer"
            verify_extension "$app" TunnelProvider packet-tunnel PacketTunnelProvider
            verify_extension "$app" DnsProxyProvider dns-proxy DnsProxyProvider
          done <<< "$configurations"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && matrix.platform == 'iOS'
        with:
          name: node-sdk-ios-swift-package
          path: ${{ steps.ios-sdk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.platform == 'iOS'
        with:
          name: node-sdk-ios-logs
          path: target/ci/node-sdk-ios
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && matrix.platform == 'Android'
        with:
          name: node-sdk-android
          path: |
            target/ci/node-sdk-android/gnunet-node-android.aar
            target/ci/node-sdk-android/gnunet-node-android-maven.zip
            target/ci/node-sdk-android/artifact.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.platform == 'Android'
        with:
          name: node-sdk-android-logs
          path: |
            target/ci/node-sdk-android/*.log
            target/ci/node-sdk-android/build.*/logs/*.log
            target/ci/node-sdk-android/build.*/logs/*.libs
          if-no-files-found: ignore
          retention-days: 7

  openharmony-sdk:
    name: Node SDK (OpenHarmony)
    needs: checks
    uses: ./.github/workflows/openharmony-sdk.yml

  reference:
    needs: [checks, tools]
    name: Pinned official C component and IPC reference
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Set private reference paths
        run: |
          printf 'GNUNET_REFERENCE_SOURCE=%s/gnunet-reference\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'GNUNET_CONFIG_REFERENCE_SOURCE=%s/gnunet-config-reference\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install independent reference tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential git python3 openssl
      - name: Fetch and verify the fixed official release
        run: |
          release=$(python3 -B tools/reference/build_reference.py --print-target release)
          revision=$(python3 -B tools/reference/build_reference.py --print-target revision)
          git clone --depth 1 --branch "$release" https://git.gnunet.org/gnunet.git "$GNUNET_REFERENCE_SOURCE"
          test "$(git -C "$GNUNET_REFERENCE_SOURCE" rev-parse HEAD)" = "$revision"
          git -C "$GNUNET_REFERENCE_SOURCE" diff --exit-code HEAD --
      - name: Fetch and verify the fixed configuration source
        run: |
          git init "$GNUNET_CONFIG_REFERENCE_SOURCE"
          git -C "$GNUNET_CONFIG_REFERENCE_SOURCE" remote add origin https://git.gnunet.org/gnunet.git
          git -C "$GNUNET_CONFIG_REFERENCE_SOURCE" fetch --depth 1 origin 7e0f9c3640310fd406fcf32c271ab583ef83d6c9
          git -C "$GNUNET_CONFIG_REFERENCE_SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$GNUNET_CONFIG_REFERENCE_SOURCE" rev-parse HEAD)" = 7e0f9c3640310fd406fcf32c271ab583ef83d6c9
          git -C "$GNUNET_CONFIG_REFERENCE_SOURCE" diff --exit-code HEAD --
      - name: Run implemented official boundaries against the fixed reference
        run: cargo xtask verify reference --log-dir target/ci/reference
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: official-reference-results
          path: |
            target/reference
            target/ci/reference
          if-no-files-found: warn
          retention-days: 7

  daemon-reference:
    needs: [checks, tools]
    name: Actual official C STATISTICS daemon and client
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Set private reference paths
        run: |
          printf 'GNUNET_REFERENCE_SOURCE=%s/gnunet-daemon-reference\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'GNUNET_REFERENCE_BUILD=%s/gnunet-daemon-reference-build/build-result.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install compiler and normal reference development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential git curl python3 python3-venv pkg-config gettext libltdl-dev libunistring-dev libsqlite3-dev libcurl4-gnutls-dev libgcrypt20-dev libgmp-dev libgnutls28-dev libidn2-dev
          dpkg-query -W > "$RUNNER_TEMP/reference-system-packages.txt"
      - name: Build fixed reference-only dependencies in a private prefix
        run: python3 -B tools/reference/bootstrap_dependencies.py --output "$RUNNER_TEMP/gnunet-reference-dependencies" --jobs 4
      - name: Fetch the pinned unmodified release and official submodule
        run: |
          release=$(python3 -B tools/reference/build_reference.py --print-target release)
          revision=$(python3 -B tools/reference/build_reference.py --print-target revision)
          git clone --depth 1 --branch "$release" https://git.gnunet.org/gnunet.git "$GNUNET_REFERENCE_SOURCE"
          test "$(git -C "$GNUNET_REFERENCE_SOURCE" rev-parse HEAD)" = "$revision"
          git -C "$GNUNET_REFERENCE_SOURCE" -c url.https://git.gnunet.org/.insteadOf=git://git.gnunet.org/ submodule update --init --recursive
          git -C "$GNUNET_REFERENCE_SOURCE" diff --exit-code --ignore-submodules=none HEAD --
      - name: Build actual upstream STATISTICS executables and libraries
        run: |
          python3 -B tools/reference/build_reference.py --source "$GNUNET_REFERENCE_SOURCE" --output "$RUNNER_TEMP/gnunet-daemon-reference-build" --prefix "$RUNNER_TEMP/gnunet-daemon-reference-prefix" --deps-prefix "$RUNNER_TEMP/gnunet-reference-dependencies/prefix" --meson "$RUNNER_TEMP/gnunet-reference-dependencies/venv/bin/meson" --ninja "$RUNNER_TEMP/gnunet-reference-dependencies/venv/bin/ninja" --jobs 4
      - name: Run actual C and Rust programs in both directions
        run: cargo xtask verify daemon-reference --log-dir target/ci/daemon-reference
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: official-statistics-daemon-reference-results
          path: |
            target/reference-daemons
            target/ci/daemon-reference
            ${{ runner.temp }}/gnunet-daemon-reference-build/*.json
            ${{ runner.temp }}/gnunet-daemon-reference-build/*.log
            ${{ runner.temp }}/gnunet-reference-dependencies/*.json
            ${{ runner.temp }}/gnunet-reference-dependencies/*.log
            ${{ runner.temp }}/reference-system-packages.txt
          if-no-files-found: warn
          retention-days: 7

  ci-complete:
    name: ci-complete
    if: always()
    needs: [checks, tools, native, freebsd, embedded, node-sdk, openharmony-sdk, reference, daemon-reference, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every mandatory check to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$JOB_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$JOB_RESULTS" | jq -e 'length > 0 and all(.[]; .result == "success")'
