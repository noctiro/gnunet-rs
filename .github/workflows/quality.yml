name: official-gnunet-quality

on: workflow_dispatch

permissions:
  contents: read

jobs:
  windows-arm:
    name: Windows ARM service and client (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, host: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, host: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          host: ${{ matrix.host }}
      - name: Run native ARM client startup and cancellation
        run: cargo test --offline --locked -p gnunet-arm-host --test windows_client
      - name: Run native ARM supervisor startup and shutdown
        if: '!cancelled()'
        run: cargo test --offline --locked -p gnunet-arm-service-host --all-features --test windows_reactor
      - name: Verify descriptor-bound AF_UNIX protection
        if: '!cancelled()'
        run: >-
          cargo test --offline --locked -p gnunet-service-runtime --test windows_local
          retained_listener_supplies_original_access_to_activation_export -- --exact
