name: official-gnunet-quality

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTDOCFLAGS: -D warnings
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONOPTIMIZE: ''

jobs:
  security:
    name: Supply chain security
    uses: ./.github/workflows/security.yml

  checks:
    name: Source policies and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflow syntax and expressions
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - uses: ./.github/actions/setup-rust
      - run: cargo xtask verify source --log-dir target/ci/source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: source-check-logs
          path: target/ci/source
          if-no-files-found: ignore
          retention-days: 7

  tools:
    name: Tool controls (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.11' }
          - { os: macos-15, python: '3.14' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -B tools/check_tools.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tool-controls-${{ matrix.os }}
          path: target/tool-controls
          retention-days: 7

  native:
    needs: checks
    name: Native workspace (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, host: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, host: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, host: x86_64-apple-darwin }
          - { os: macos-15, host: aarch64-apple-darwin }
          - { os: windows-2025, host: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, host: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          host: ${{ matrix.host }}
      - run: cargo xtask verify native --log-dir target/ci/native
        env:
          # Keep Darwin paths short without using /tmp's final symlink.
          TMPDIR: ${{ runner.os == 'Windows' && runner.temp || runner.os == 'macOS' && '/private/tmp' || '/tmp' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: native-logs-${{ matrix.host }}
          path: target/ci/native
          if-no-files-found: ignore
          retention-days: 7

  freebsd:
    needs: checks
    name: Native workspace (FreeBSD ${{ matrix.release }} x86_64)
    strategy:
      fail-fast: false
      matrix:
        release: ['14.5', '15.1']
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run unprivileged checks and transfer diagnostics
        id: vm
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b
        with:
          release: ${{ matrix.release }}
          arch: x86_64
          mem: 6144
          cpu: 2
          sync: rsync
          copyback: true
          prepare: |
            set -eu
            pkg install -y ca_root_nss git python311 rustup-init
            kldload -n netlink
            ln -sf /usr/local/bin/python3.11 /usr/local/bin/python3
            pw useradd -n ci -m -s /bin/sh
          run: |
            set -eu
            source_directory=$PWD
            build_directory=$(mktemp -d /tmp/gnunet-ci.XXXXXX)
            cp -R "$source_directory/." "$build_directory"
            chown -R ci:ci "$build_directory"
            status=0
            su -l ci -c "cd '$build_directory' && sh tools/ci/freebsd.sh" || status=$?
            diagnostics="$source_directory/target/ci/freebsd"
            mkdir -p "$diagnostics"
            printf '%s\n' "$status" > "$diagnostics/exit-code"
            if [ -d "$build_directory/target/ci" ]; then
              cp -R "$build_directory/target/ci/." "$diagnostics"
            fi
            if [ -d "$build_directory/target/tool-controls" ]; then
              cp -R "$build_directory/target/tool-controls" "$diagnostics/tool-controls"
            fi
            # The action copies back only after a successful transport step.
            # This synced tree contains diagnostics; builds stay in /tmp.
      - name: Require successful FreeBSD checks
        run: |
          status=$(cat target/ci/freebsd/exit-code)
          if ! [[ "$status" =~ ^(0|[1-9][0-9]{0,2})$ ]] || (( status > 255 )); then
            echo 'Invalid FreeBSD check result' >&2
            exit 1
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: freebsd-logs-${{ matrix.release }}-x86_64
          path: target/ci/freebsd
          if-no-files-found: ignore
          retention-days: 7

  embedded:
    needs: checks
    name: Official no_std Cortex-M0 and Cortex-M4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: thumbv6m-none-eabi, thumbv7em-none-eabi
      - run: cargo xtask verify embedded --log-dir target/ci/embedded
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: embedded-check-logs
          path: target/ci/embedded
          if-no-files-found: ignore
          retention-days: 7

  reference:
    needs: [checks, tools]
    name: Pinned official C component and IPC reference
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Set private reference paths
        run: printf 'GNUNET_REFERENCE_SOURCE=%s/gnunet-reference-0.29.1\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install independent reference tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential git python3 openssl
      - name: Fetch and verify the fixed official release
        run: |
          git clone --depth 1 --branch v0.29.1 https://git.gnunet.org/gnunet.git "$GNUNET_REFERENCE_SOURCE"
          test "$(git -C "$GNUNET_REFERENCE_SOURCE" rev-parse HEAD)" = 346358e26d4dcc2dc4f51bef5d52dca29c7d8165
          git -C "$GNUNET_REFERENCE_SOURCE" diff --exit-code HEAD --
      - name: Run implemented official boundaries against the fixed reference
        run: cargo xtask verify reference --log-dir target/ci/reference
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: official-reference-results
          path: |
            target/reference
            target/ci/reference
          if-no-files-found: warn
          retention-days: 7

  daemon-reference:
    needs: [checks, tools]
    name: Actual official C STATISTICS daemon and client
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Set private reference paths
        run: |
          printf 'GNUNET_REFERENCE_SOURCE=%s/gnunet-daemon-reference-0.29.1\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'GNUNET_REFERENCE_BUILD=%s/gnunet-daemon-reference-build/build-result.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install compiler and normal reference development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential git curl python3 python3-venv pkg-config gettext libltdl-dev libunistring-dev libsqlite3-dev libcurl4-gnutls-dev libgcrypt20-dev libgmp-dev libgnutls28-dev libidn2-dev
          dpkg-query -W > "$RUNNER_TEMP/reference-system-packages.txt"
      - name: Build fixed reference-only dependencies in a private prefix
        run: python3 -B tools/reference/bootstrap_dependencies.py --output "$RUNNER_TEMP/gnunet-reference-dependencies" --jobs 4
      - name: Fetch the pinned unmodified release and official submodule
        run: |
          git clone --depth 1 --branch v0.29.1 https://git.gnunet.org/gnunet.git "$GNUNET_REFERENCE_SOURCE"
          git -C "$GNUNET_REFERENCE_SOURCE" -c url.https://git.gnunet.org/.insteadOf=git://git.gnunet.org/ submodule update --init --recursive
          test "$(git -C "$GNUNET_REFERENCE_SOURCE" rev-parse HEAD)" = 346358e26d4dcc2dc4f51bef5d52dca29c7d8165
          git -C "$GNUNET_REFERENCE_SOURCE" diff --exit-code --ignore-submodules=none HEAD --
      - name: Build actual upstream STATISTICS executables and libraries
        run: |
          python3 -B tools/reference/build_reference.py --source "$GNUNET_REFERENCE_SOURCE" --output "$RUNNER_TEMP/gnunet-daemon-reference-build" --prefix "$RUNNER_TEMP/gnunet-daemon-reference-prefix" --deps-prefix "$RUNNER_TEMP/gnunet-reference-dependencies/prefix" --meson "$RUNNER_TEMP/gnunet-reference-dependencies/venv/bin/meson" --ninja "$RUNNER_TEMP/gnunet-reference-dependencies/venv/bin/ninja" --jobs 4
      - name: Run actual C and Rust programs in both directions
        run: cargo xtask verify daemon-reference --log-dir target/ci/daemon-reference
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: official-statistics-daemon-reference-results
          path: |
            target/reference-daemons
            target/ci/daemon-reference
            ${{ runner.temp }}/gnunet-daemon-reference-build/*.json
            ${{ runner.temp }}/gnunet-daemon-reference-build/*.log
            ${{ runner.temp }}/gnunet-reference-dependencies/*.json
            ${{ runner.temp }}/gnunet-reference-dependencies/*.log
            ${{ runner.temp }}/reference-system-packages.txt
          if-no-files-found: warn
          retention-days: 7

  ci-complete:
    name: ci-complete
    if: always()
    needs: [checks, tools, native, freebsd, embedded, reference, daemon-reference, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every mandatory check to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$JOB_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          printf '%s\n' "$JOB_RESULTS" | jq -e 'length > 0 and all(.[]; .result == "success")'
