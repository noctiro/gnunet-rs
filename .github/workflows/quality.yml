name: official-gnunet-quality

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTDOCFLAGS: -D warnings
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare the fixed secret scanner
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete Git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact=100 --config .gitleaks.toml --log-opts=--all .

  checks:
    name: Formatting and official architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflow syntax and expressions
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - uses: ./.github/actions/setup-rust
      - run: cargo xtask verify format
      - run: cargo xtask verify lint

  tools:
    name: Tool controls (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.11' }
          - { os: macos-15, python: '3.14' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -B tools/check_tools.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tool-controls-${{ matrix.os }}
          path: target/tool-controls
          retention-days: 7

  tests:
    name: Native ${{ matrix.group }} (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, host: x86_64-unknown-linux-gnu, group: test }
          - { os: ubuntu-24.04-arm, host: aarch64-unknown-linux-gnu, group: test }
          - { os: macos-15-intel, host: x86_64-apple-darwin, group: test }
          - { os: macos-15, host: aarch64-apple-darwin, group: test }
          - { os: windows-2025, host: x86_64-pc-windows-msvc, group: runtime }
          - { os: windows-11-arm, host: aarch64-pc-windows-msvc, group: runtime }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          host: ${{ matrix.host }}
      - run: cargo xtask verify ${{ matrix.group }}
        env:
          # Darwin has a short Unix socket path limit.
          TMPDIR: ${{ runner.os == 'Windows' && runner.temp || '/tmp' }}

  portable:
    name: Portable core and feature tiers (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, host: x86_64-unknown-linux-gnu }
          - { os: windows-2025, host: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, host: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          host: ${{ matrix.host }}
      - run: cargo xtask verify portable

  freebsd:
    name: Native workspace (FreeBSD ${{ matrix.release }} x86_64)
    strategy:
      fail-fast: false
      matrix:
        release: ['14.5', '15.1']
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run unprivileged tests in FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc
        with:
          release: ${{ matrix.release }}
          arch: x86_64
          mem: 6144
          cpu: 2
          sync: rsync
          copyback: false
          prepare: |
            set -eu
            pkg install -y ca_root_nss git python311 rustup-init
            ln -sf /usr/local/bin/python3.11 /usr/local/bin/python3
            pw useradd -n ci -m -s /bin/sh
          run: |
            set -eu
            chown -R ci:ci .
            su -l ci -c "cd '$PWD' && sh tools/ci/freebsd.sh"

  embedded:
    name: Official no_std Cortex-M0 and Cortex-M4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: thumbv6m-none-eabi, thumbv7em-none-eabi
      - run: cargo xtask verify embedded

  reference:
    needs: [checks, tools]
    name: Pinned official C component and IPC reference
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Set private reference paths
        run: printf 'GNUNET_REFERENCE_SOURCE=%s/gnunet-reference-0.29.1\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install independent reference tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential git python3 openssl
      - name: Fetch and verify the fixed official release
        run: |
          git clone --depth 1 --branch v0.29.1 https://git.gnunet.org/gnunet.git "$GNUNET_REFERENCE_SOURCE"
          test "$(git -C "$GNUNET_REFERENCE_SOURCE" rev-parse HEAD)" = 346358e26d4dcc2dc4f51bef5d52dca29c7d8165
          git -C "$GNUNET_REFERENCE_SOURCE" diff --exit-code HEAD --
      - name: Run implemented official boundaries against the fixed reference
        run: cargo xtask verify reference
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: official-reference-results
          path: target/reference
          if-no-files-found: warn
          retention-days: 7

  daemon-reference:
    needs: [checks, tools]
    name: Actual official C STATISTICS daemon and client
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Set private reference paths
        run: |
          printf 'GNUNET_REFERENCE_SOURCE=%s/gnunet-daemon-reference-0.29.1\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'GNUNET_REFERENCE_BUILD=%s/gnunet-daemon-reference-build/build-result.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install compiler and normal reference development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential git curl python3 python3-venv pkg-config gettext libltdl-dev libunistring-dev libsqlite3-dev libcurl4-gnutls-dev libgcrypt20-dev libgmp-dev libgnutls28-dev libidn2-dev
          dpkg-query -W > "$RUNNER_TEMP/reference-system-packages.txt"
      - name: Build fixed reference-only dependencies in a private prefix
        run: python3 -B tools/reference/bootstrap_dependencies.py --output "$RUNNER_TEMP/gnunet-reference-dependencies" --jobs 4
      - name: Fetch the pinned unmodified release and official submodule
        run: |
          git clone --depth 1 --branch v0.29.1 https://git.gnunet.org/gnunet.git "$GNUNET_REFERENCE_SOURCE"
          git -C "$GNUNET_REFERENCE_SOURCE" -c url.https://git.gnunet.org/.insteadOf=git://git.gnunet.org/ submodule update --init --recursive
          test "$(git -C "$GNUNET_REFERENCE_SOURCE" rev-parse HEAD)" = 346358e26d4dcc2dc4f51bef5d52dca29c7d8165
          git -C "$GNUNET_REFERENCE_SOURCE" diff --exit-code --ignore-submodules=none HEAD --
      - name: Build actual upstream STATISTICS executables and libraries
        run: |
          python3 -B tools/reference/build_reference.py --source "$GNUNET_REFERENCE_SOURCE" --output "$RUNNER_TEMP/gnunet-daemon-reference-build" --prefix "$RUNNER_TEMP/gnunet-daemon-reference-prefix" --deps-prefix "$RUNNER_TEMP/gnunet-reference-dependencies/prefix" --meson "$RUNNER_TEMP/gnunet-reference-dependencies/venv/bin/meson" --ninja "$RUNNER_TEMP/gnunet-reference-dependencies/venv/bin/ninja" --jobs 4
      - name: Run actual C and Rust programs in both directions
        run: cargo xtask verify daemon-reference
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: official-statistics-daemon-reference-results
          path: |
            target/reference-daemons
            ${{ runner.temp }}/gnunet-daemon-reference-build/*.json
            ${{ runner.temp }}/gnunet-daemon-reference-build/*.log
            ${{ runner.temp }}/gnunet-reference-dependencies/*.json
            ${{ runner.temp }}/gnunet-reference-dependencies/*.log
            ${{ runner.temp }}/reference-system-packages.txt
          if-no-files-found: warn
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Cache the pinned audit executable
        id: audit-cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ runner.temp }}/cargo-audit/bin
          key: cargo-audit-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "=$CARGO_AUDIT_VERSION" --locked --no-default-features --root "$RUNNER_TEMP/cargo-audit"
      - name: Add the audit executable to PATH
        run: echo "$RUNNER_TEMP/cargo-audit/bin" >> "$GITHUB_PATH"
      - name: Audit all source lockfiles
        run: |
          mkdir -p target/audit
          database="$RUNNER_TEMP/advisory-db"
          git clone --depth 1 https://github.com/RustSec/advisory-db "$database"
          git -C "$database" rev-parse HEAD > target/audit/database-revision.txt
          failed=0
          while IFS= read -r -d '' lockfile; do
            profile="${lockfile//\//_}"
            if cargo audit --db "$database" --no-fetch --file "$lockfile" --json --deny warnings > "target/audit/$profile.json"; then
              echo "$profile audit passed"
            else
              failed=1
              echo "$profile audit failed"
            fi
            cat "target/audit/$profile.json"
          done < <(git ls-files -z -- Cargo.lock '**/Cargo.lock')
          exit "$failed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit-results
          path: target/audit
          if-no-files-found: ignore
          retention-days: 7
