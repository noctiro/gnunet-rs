name: Repository Rust environment
description: Install the repository toolchain and cache downloaded Cargo inputs
inputs:
  host:
    description: Expected native Rust host triple (fail if the runner architecture changes)
    default: ''
  targets:
    description: Additional Rust targets, separated by commas
    default: ''
runs:
  using: composite
  steps:
    - name: Install and verify the repository toolchain
      shell: bash
      env:
        EXPECTED_RUST_HOST: ${{ inputs.host }}
        EXTRA_RUST_TARGETS: ${{ inputs.targets }}
      run: |
        sh tools/ci/setup-rust.sh
    - name: Cache downloaded dependencies
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
        key: cargo-inputs-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-inputs-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Fetch locked dependency inputs
      shell: bash
      run: |
        git ls-files -z -- Cargo.lock '**/Cargo.lock' | while IFS= read -r -d '' lockfile; do
          cargo fetch --locked --manifest-path "${lockfile%Cargo.lock}Cargo.toml"
        done
