[peerstore]
BINARY = gnunet-service-peerstore
START_ON_DEMAND = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_RUNTIME_DIR/peerstore
UNIX_MATCH_UID = YES
USE_INCLUDED_HELLOS = NO

[nat]
BINARY = gnunet-service-nat
START_ON_DEMAND = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_RUNTIME_DIR/nat
UNIX_MATCH_UID = YES
# Interface scans initiate NAT reversal helper discovery.
ENABLE_UPNP = NO
ENABLE_IPSCAN = NO
USE_STUN = NO
RETURN_LOCAL_ADDRESSES = YES

[core]
BINARY = gnunet-service-core
START_ON_DEMAND = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_RUNTIME_DIR/core
UNIX_MATCH_UID = YES

[nse]
BINARY = gnunet-service-nse
START_ON_DEMAND = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_RUNTIME_DIR/nse
UNIX_MATCH_UID = YES
PROOFFILE = $GNUNET_DATA_HOME/nse/proof.dat
WORKBITS = 15
INTERVAL = 1 h
WORKDELAY = 5 ms

[dht]
BINARY = gnunet-service-dht
START_ON_DEMAND = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_RUNTIME_DIR/dht
UNIX_MATCH_UID = YES

[dhtu-gnunet]
ENABLED = YES

[dhtu-ip]
ENABLED = NO

[topology]
BINARY = gnunet-daemon-topology
IMMEDIATE_START = YES
NOARMBIND = YES
PIPECONTROL = YES

[communicator-tcp]
BINARY = gnunet-communicator-tcp
IMMEDIATE_START = YES
NOARMBIND = YES
PIPECONTROL = YES
# Override the numeric bind addresses to accept connections from other hosts.
BINDTO = 127.0.0.1:0

[communicator-udp]
BINARY = gnunet-communicator-udp
IMMEDIATE_START = YES
NOARMBIND = YES
PIPECONTROL = YES
BINDTO = 127.0.0.1:0
BINDTO6 = [::1]:0
DISABLE_BROADCAST = YES

[transport]
BINARY = gnunet-service-transport
IMMEDIATE_START = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_RUNTIME_DIR/transport
UNIX_MATCH_UID = YES
USE_BURST_NAT = NO

[pils]
BINARY = gnunet-service-pils
IMMEDIATE_START = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_RUNTIME_DIR/pils
UNIX_MATCH_UID = YES
PROFILE = reference029
