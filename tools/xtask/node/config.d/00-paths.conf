[PATHS]
GNUNET_HOME = ${GNUNET_TEST_HOME:-${HOME:-${USERPROFILE}}}
GNUNET_DATA_HOME = ${XDG_DATA_HOME:-$GNUNET_HOME/.local/share}/gnunet-rs
GNUNET_CONFIG_HOME = ${XDG_CONFIG_HOME:-$GNUNET_HOME/.config}/gnunet-rs
GNUNET_CACHE_HOME = ${XDG_CACHE_HOME:-$GNUNET_HOME/.cache}/gnunet-rs
GNUNET_USER_RUNTIME_DIR = ${XDG_RUNTIME_DIR:-${TMPDIR:-${TEMP:-${TMP:-$GNUNET_HOME}}}}/gnrs-${USER:-${USERNAME:-user}}
GNUNET_RUNTIME_DIR = $GNUNET_USER_RUNTIME_DIR
GNUNET_TMP = $GNUNET_USER_RUNTIME_DIR/tmp

[peer]
PRIVATE_KEY = $GNUNET_DATA_HOME/private_key.ecc
