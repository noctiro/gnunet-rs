[arm]
BINARY = gnunet-service-arm
UNIXPATH = $GNUNET_USER_RUNTIME_DIR/arm
UNIX_MATCH_UID = YES

[resolver]
BINARY = gnunet-service-resolver
START_ON_DEMAND = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_RUNTIME_DIR/resolver
UNIX_MATCH_UID = YES

[statistics]
BINARY = gnunet-service-statistics
START_ON_DEMAND = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_RUNTIME_DIR/statistics
UNIX_MATCH_UID = YES
DATABASE = $GNUNET_DATA_HOME/statistics/database
