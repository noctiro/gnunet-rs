[identity]
BINARY = gnunet-service-identity
START_ON_DEMAND = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_USER_RUNTIME_DIR/identity
UNIX_MATCH_UID = YES

[namecache]
BINARY = gnunet-service-namecache
START_ON_DEMAND = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_RUNTIME_DIR/namecache
UNIX_MATCH_UID = YES

[namestore]
BINARY = gnunet-service-namestore
START_ON_DEMAND = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_USER_RUNTIME_DIR/namestore
UNIX_MATCH_UID = YES

[setu]
BINARY = gnunet-service-setu
START_ON_DEMAND = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_RUNTIME_DIR/setu
UNIX_MATCH_UID = YES

[revocation]
BINARY = gnunet-service-revocation
START_ON_DEMAND = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_RUNTIME_DIR/revocation
UNIX_MATCH_UID = YES
DATABASE = $GNUNET_DATA_HOME/revocation.dat

[gns]
BINARY = gnunet-service-gns
START_ON_DEMAND = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_USER_RUNTIME_DIR/gns
UNIX_MATCH_UID = YES
INTERCEPT_DNS = NO

[datastore]
BINARY = gnunet-service-datastore
START_ON_DEMAND = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_RUNTIME_DIR/datastore
UNIX_MATCH_UID = YES

[cadet]
BINARY = gnunet-service-cadet
START_ON_DEMAND = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_RUNTIME_DIR/cadet
UNIX_MATCH_UID = YES

[fs]
BINARY = gnunet-service-fs
START_ON_DEMAND = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_RUNTIME_DIR/fs
UNIX_MATCH_UID = YES

[zonemaster]
BINARY = gnunet-service-zonemaster
IMMEDIATE_START = YES
PIPECONTROL = YES
UNIXPATH = $GNUNET_USER_RUNTIME_DIR/zonemaster
UNIX_MATCH_UID = YES
WORKER_COUNT = 1
MAX_PARALLEL_BACKGROUND_QUERIES = 32
